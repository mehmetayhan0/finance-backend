<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet'in Finans Asistanı</title>
    
    <!-- PWA Manifest Tanımlaması -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finansım">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Menü / Navbar */
        header {
            background-color: #1e293b;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: #38bdf8;
        }

        .install-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .install-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Ana Web İçeriği (Webden Kullanım Alanı) */
        main {
            flex: 1;
            padding: 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .card h2 {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .card .amount {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
        }

        .status-banner {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>📊</span> Mehmet'in Finans Asistanı
        </div>
        <!-- Uygulamayı İndir / Yükle Butonu -->
        <button id="pwaInstallBtn" class="install-btn" onclick="installPWA()">
            📲 Uygulamayı Yükle
        </button>
    </header>

    <main>
        <div id="webNotice" class="status-banner">
            🌐 Şu an web sürümündesiniz. İsterseniz yukarıdaki **"Uygulamayı Yükle"** butonundan cihazınıza yükleyebilirsiniz.
        </div>

        <div class="card">
            <h2>Toplam Varlık</h2>
            <div class="amount">₺0,00</div>
        </div>

        <div class="card">
            <h2>Aylık Gelir / Gider Özeti</h2>
            <p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Finansal verileriniz yükleniyor...</p>
        </div>
    </main>

    <script>
        let deferredPrompt = null;
        const installBtn = document.getElementById('pwaInstallBtn');

        // Service Worker Kaydı (PWA için Zorunlu)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Hata:', err));
            });
        }

        // Tarayıcı yükleme imkanı sunduğunda olayı yakala
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex'; // Butonu görünür kıl
        });

        function installPWA() {
            if (deferredPrompt) {
                // Eğer tarayıcı yüklemeye hazırsa pencereyi aç
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Kullanıcı uygulamayı yükledi.');
                    }
                    deferredPrompt = null;
                });
            } else {
                // Eğer uygulama zaten yüklüyse veya tarayıcı desteği yoksa bilgilendir
                alert("Uygulama zaten cihazınızda yüklü olabilir veya tarayıcınız otomatik yüklemeyi desteklemiyor.\n\nChrome/Safari kullanıyorsanız menüden 'Ana Ekrana Ekle' veya 'Uygulamayı Yükle' seçeneğini kullanabilirsiniz.");
            }
        }

        // Uygulama yüklendikten sonra tetiklenir
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            alert("Mehmet'in Finans Asistanı başarıyla cihazınıza yüklendi!");
        });
    </script>
</body>
</html>
