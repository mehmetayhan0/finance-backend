<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finans Asistanım</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-4">

    <!-- MOBİL KONTEYNER -->
    <div class="w-full max-w-md space-y-5">
        
        <!-- ÜST BAŞLIK -->
        <header class="flex justify-between items-center py-2 border-b border-gray-800">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid font-bold text-2xl">⚡</i> Finans Asistanım
            </h1>
            <button id="logoutBtn" onclick="logout()" class="hidden text-xs bg-red-500/20 hover:bg-red-500/40 text-red-400 px-3 py-1.5 rounded-lg border border-red-500/30">
                Çıkış Yap
            </button>
        </header>

        <!-- GİRİŞ / KAYIT EKRANI -->
        <div id="authScreen" class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 id="authTitle" class="text-lg font-semibold text-gray-200 text-center">Hesabınıza Giriş Yapın</h2>
            <div class="space-y-3">
                <input id="username" type="text" placeholder="Kullanıcı Adı" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 text-sm">
                <input id="password" type="password" placeholder="Şifre" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 focus:outline-none focus:border-emerald-500 text-sm">
                <button onclick="handleAuth()" id="authSubmitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold text-gray-950 py-3 rounded-xl text-sm transition">
                    Giriş Yap
                </button>
            </div>
            <div class="text-center text-xs text-gray-400 pt-2">
                <span id="authToggleText">Hesabın yok mu?</span>
                <button onclick="toggleAuthMode()" id="authToggleBtn" class="text-emerald-400 font-medium underline ml-1">Kayıt Ol</button>
            </div>
        </div>

        <!-- PORTFÖY DÖKÜMÜ (GİRİŞ YAPILINCA AÇILIR) -->
        <div id="portfolioScreen" class="hidden space-y-5">
            
            <!-- TOPLAM BAKİYE KARTI -->
            <div class="bg-gradient-to-br from-emerald-900/40 to-gray-900 border border-emerald-500/30 rounded-2xl p-5 shadow-lg">
                <p class="text-xs text-emerald-400 font-medium">Toplam Portföy Değeri</p>
                <p id="totalPortfolioTL" class="text-3xl font-extrabold text-white mt-1">₺0.00</p>
            </div>

            <!-- VARLIK / HİSSE EKLEME FORMU -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 space-y-3">
                <p class="text-xs font-semibold text-gray-400">Yeni Varlık / Hisse Ekle</p>
                <div class="flex gap-2">
                    <input id="assetSymbol" type="text" placeholder="Sembol (THYAO, ALTIN, EURO)" class="w-2/3 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 uppercase">
                    <input id="assetAmount" type="number" placeholder="Miktar (Lot/Gram)" class="w-1/3 bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="addAsset()" class="w-full bg-emerald-500 hover:bg-emerald-600 font-semibold text-gray-950 py-2.5 rounded-xl text-xs transition">
                    Portföye Ekle
                </button>
            </div>

            <!-- LİSTE -->
            <div class="space-y-2">
                <p class="text-xs font-semibold text-gray-400 px-1">Varlıklarım</p>
                <div id="assetList" class="space-y-2">
                    <!-- Dinamik içerik JavaScript ile dolacak -->
                </div>
            </div>

        </div>

    </div>

    <!-- JAVASCRIPT MOTORU -->
    <script>
        let isLoginMode = true;
        const API_URL = window.location.origin;

        // Sayfa açıldığında token kontrolü
        window.onload = () => {
            const token = localStorage.getItem("token");
            if (token) {
                showPortfolio();
            }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("authTitle").innerText = isLoginMode ? "Hesabınıza Giriş Yapın" : "Yeni Hesap Oluşturun";
            document.getElementById("authSubmitBtn").innerText = isLoginMode ? "Giriş Yap" : "Kayıt Ol";
            document.getElementById("authToggleText").innerText = isLoginMode ? "Hesabın yok mu?" : "Zaten hesabın var mı?";
            document.getElementById("authToggleBtn").innerText = isLoginMode ? "Kayıt Ol" : "Giriş Yap";
        }

        async function handleAuth() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const endpoint = isLoginMode ? "/login" : "/register";

            try {
                const res = await fetch(API_URL + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || "İşlem başarısız!");

                if (isLoginMode) {
                    localStorage.setItem("token", data.access_token);
                    showPortfolio();
                } else {
                    alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
                    toggleAuthMode();
                }
            } catch (err) {
                alert(err.message);
            }
        }

        function showPortfolio() {
            document.getElementById("authScreen").classList.add("hidden");
            document.getElementById("portfolioScreen").classList.remove("hidden");
            document.getElementById("logoutBtn").classList.remove("hidden");
            loadPortfolioData();
        }

        async function loadPortfolioData() {
            const token = localStorage.getItem("token");
            try {
                const res = await fetch(API_URL + "/portfolio/my", {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();

                if (!res.ok) throw new Error("Portföy yüklenemedi.");

                document.getElementById("totalPortfolioTL").innerText = "₺" + data.portfolio_total_tl.toLocaleString('tr-TR', {minimumFractionDigits: 2});
                
                const listEl = document.getElementById("assetList");
                listEl.innerHTML = "";

                if (data.items.length === 0) {
                    listEl.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Henüz eklenmiş bir varlık yok.</p>`;
                    return;
                }

                data.items.forEach(item => {
                    listEl.innerHTML += `
                        <div class="bg-gray-900 border border-gray-800/80 rounded-xl p-3.5 flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm text-gray-100">${item.symbol}</p>
                                <p class="text-xs text-gray-400">${item.amount} Adet/Gram • Birim: ₺${item.unit_price_tl}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <p class="font-semibold text-sm text-emerald-400">₺${item.total_value_tl.toLocaleString('tr-TR')}</p>
                                <button onclick="deleteAsset(${item.id})" class="text-gray-500 hover:text-red-400 text-xs p-1">✕</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function addAsset() {
            const symbol = document.getElementById("assetSymbol").value;
            const amount = parseFloat(document.getElementById("assetAmount").value);
            const token = localStorage.getItem("token");

            if (!symbol || !amount) return alert("Lütfen sembol ve miktar girin!");

            try {
                const res = await fetch(API_URL + "/portfolio/add", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token 
                    },
                    body: JSON.stringify({ symbol, amount })
                });
                if (res.ok) {
                    document.getElementById("assetSymbol").value = "";
                    document.getElementById("assetAmount").value = "";
                    loadPortfolioData();
                }
            } catch (err) {
                alert("Ekleme hatası!");
            }
        }

        async function deleteAsset(id) {
            const token = localStorage.getItem("token");
            try {
                await fetch(`${API_URL}/portfolio/delete/${id}`, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + token }
                });
                loadPortfolioData();
            } catch (err) {
                alert("Silme hatası!");
            }
        }

        function logout() {
            localStorage.removeItem("token");
            location.reload();
        }
    </script>
</body>
</html>
