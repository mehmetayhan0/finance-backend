<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet'in Finans Asistanı</title>
    
    <!-- PWA Manifest & Tema -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" href="/icon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1px solid #334155;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-download {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-download:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        .info-note {
            margin-top: 16px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">📊</div>
        <h1>Mehmet'in Finans Asistanı</h1>
        <p>Gelir ve giderlerinizi kolayca takip edin, finansal analizlerinizi tek bir yerden yönetin.</p>
        
        <button id="downloadBtn" class="btn-download" onclick="triggerDownload()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Uygulamayı İndir
        </button>

        <p class="info-note">Güvenli indirme linki. Herhangi bir kurulum gerektirmeden hızlıca başlatın.</p>
    </div>

    <script>
        let deferredPrompt = null;

        // Tarayıcı PWA yükleme olayı tetiklendiğinde yakala
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function triggerDownload() {
            // 1. Öncelik: Eğer tarayıcı PWA yüklemesine izin veriyorsa istemi göster
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Kullanıcı yüklemeyi kabul etti.');
                    }
                    deferredPrompt = null;
                });
            } else {
                // 2. Öncelik (Düzeltme): Eğer istem yoksa kilitlenmek yerine doğrudan dosya indirmeye yönlendir
                // URL sonuna timestamp ekleyerek tarayıcı engelini/cache sorununu aşıyoruz
                const timestamp = new Date().getTime();
                window.location.href = `/download?t=${timestamp}`;
            }
        }

        // Uygulama yüklendiğinde tetiklenecek olay
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            console.log('Uygulama başarıyla yüklendi.');
        });
    </script>
</body>
</html>
