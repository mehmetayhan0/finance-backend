<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finansım - Kalıcı Portföy Takibi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

        h2 {
            color: #6366f1;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        input, select {
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #6366f1;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #059669;
        }

        .summary-card {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .summary-card small {
            opacity: 0.8;
            font-size: 13px;
        }

        .summary-card h1 {
            font-size: 28px;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }

        th {
            color: #94a3b8;
            font-weight: 600;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-msg {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Finansım - Portföy Yönetimi</h2>

        <!-- Ekleme Formu -->
        <form id="assetForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="assetType">Varlık Türü</label>
                    <select id="assetType">
                        <option value="Hisse">Hisse Senedi</option>
                        <option value="Döviz">Döviz</option>
                        <option value="Altın">Altın / Gümüş</option>
                        <option value="Kripto">Kripto Para</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assetCode">Varlık Kodu</label>
                    <input type="text" id="assetCode" placeholder="Örn: THYAO, USD, BTC" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="assetQty">Adet / Miktar</label>
                    <input type="text" id="assetQty" placeholder="Örn: 10 veya 1.5" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="assetCost">Alış Fiyatı (₺)</label>
                    <input type="text" id="assetCost" placeholder="Örn: 300.50" required autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn">+ Portföye Ekle / Güncelle</button>
        </form>

        <!-- Toplam Değer Kartı -->
        <div class="summary-card">
            <small>Portföy Toplam Maliyeti</small>
            <h1 id="totalPortfolioValue">₺0.00</h1>
        </div>

        <!-- Portföy Listesi Tablosu -->
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Tür</th>
                        <th>Varlık</th>
                        <th>Adet</th>
                        <th>Alış Fiyatı</th>
                        <th>Toplam Tutar</th>
                        <th style="text-align: center;">İşlem</th>
                    </tr>
                </thead>
                <tbody id="portfolioTableBody">
                    <!-- Dinamik Kalıcı Veriler Buraya Gelecek -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Portföy verilerini tutacağımız dizi
        let myPortfolio = [];

        // Sayfa yüklendiğinde hafızadaki verileri çek
        window.addEventListener('DOMContentLoaded', () => {
            loadPortfolioFromStorage();
        });

        const form = document.getElementById('assetForm');

        // Form Gönderildiğinde (Butona tıklandığında)
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Sayfanın yenilenmesini engeller

            const type = document.getElementById('assetType').value;
            const code = document.getElementById('assetCode').value.trim().toUpperCase();
            let qtyStr = document.getElementById('assetQty').value.trim().replace(',', '.');
            let costStr = document.getElementById('assetCost').value.trim().replace(',', '.');

            const qty = parseFloat(qtyStr);
            const cost = parseFloat(costStr);

            if (!code || isNaN(qty) || isNaN(cost) || qty <= 0 || cost <= 0) {
                alert("Lütfen tüm alanları geçerli sayılarla doldurun!");
                return;
            }

            // Aynı varlık daha önce eklenmiş mi kontrol et
            const existingIndex = myPortfolio.findIndex(item => item.code === code);

            if (existingIndex !== -1) {
                // Varlık zaten varsa adet ve maliyetini güncelle
                myPortfolio[existingIndex].qty = qty;
                myPortfolio[existingIndex].cost = cost;
                myPortfolio[existingIndex].type = type;
            } else {
                // Yoksa yeni varlık olarak ekle
                myPortfolio.push({
                    id: Date.now(),
                    type: type,
                    code: code,
                    qty: qty,
                    cost: cost
                });
            }

            // Hafızaya Kaydet ve Ekranı Güncelle
            savePortfolioToStorage();
            renderPortfolio();

            // Formu Temizle
            document.getElementById('assetCode').value = '';
            document.getElementById('assetQty').value = '';
            document.getElementById('assetCost').value = '';
        });

        // Veriyi Silme Fonksiyonu
        function deleteAsset(id) {
            myPortfolio = myPortfolio.filter(item => item.id !== id);
            savePortfolioToStorage();
            renderPortfolio();
        }

        // Yerel Hafızaya (localStorage) Kaydetme - Sen silmediğin sürece silinmez
        function savePortfolioToStorage() {
            localStorage.setItem('finansim_portfolio_data', JSON.stringify(myPortfolio));
        }

        // Yerel Hafızadan Verileri Yükleme
        function loadPortfolioFromStorage() {
            const savedData = localStorage.getItem('finansim_portfolio_data');
            if (savedData) {
                try {
                    myPortfolio = JSON.parse(savedData);
                } catch (e) {
                    myPortfolio = [];
                }
            }
            renderPortfolio();
        }

        // Ekrana Tabloyu Çizdirme
        function renderPortfolio() {
            const tbody = document.getElementById('portfolioTableBody');
            tbody.innerHTML = '';

            let totalPortfolioCost = 0;

            if (myPortfolio.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">Portföyünüzde henüz bir varlık bulunmuyor. Yukarıdaki formdan ekleyebilirsiniz.</td></tr>`;
                document.getElementById('totalPortfolioValue').innerText = "₺0.00";
                return;
            }

            myPortfolio.forEach(item => {
                const totalItemCost = item.qty * item.cost;
                totalPortfolioCost += totalItemCost;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><small style="color:#94a3b8;">${item.type}</small></td>
                    <td><strong>${item.code}</strong></td>
                    <td>${item.qty.toLocaleString('tr-TR')}</td>
                    <td>₺${item.cost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td><strong>₺${totalItemCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</strong></td>
                    <td style="text-align: center;">
                        <button class="btn-delete" onclick="deleteAsset(${item.id})">Sil</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Toplam Tutar Güncelleme
            document.getElementById('totalPortfolioValue').innerText = "₺" + totalPortfolioCost.toLocaleString('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>
</body>
</html>
