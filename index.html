<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finans Asistanım - Portföy & Kâr/Zarar</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h2 { margin-top: 0; color: #38bdf8; }
        input, button { padding: 10px 14px; margin: 5px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; width: 100%; }
        button { background: #0284c7; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #0369a1; }
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-group input { flex: 1; min-width: 140px; }
        .form-group button { flex: 1; min-width: 120px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }
        .profit { color: #4ade80; font-weight: bold; }
        .loss { color: #f87171; font-weight: bold; }
        .btn-delete { background: #ef4444; width: auto; padding: 6px 12px; font-size: 12px; }
        .btn-delete:hover { background: #dc2626; }
        .hidden { display: none; }
        .summary-box { display: flex; justify-content: space-between; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .summary-item { text-align: center; }
        .summary-item label { font-size: 12px; color: #94a3b8; display: block; }
        .summary-item span { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Giriş / Kayıt Formu -->
    <div id="auth-section" class="card">
        <h2 id="form-title">Giriş Yap</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı">
        <input type="password" id="password" placeholder="Şifre">
        <button onclick="handleAuth()">Giriş Yap</button>
        <p style="text-align: center; font-size: 14px; margin-top: 10px;">
            <a href="#" id="toggle-auth" onclick="toggleAuthMode()" style="color: #38bdf8; text-decoration: none;">Hesabın yok mu? Kayıt Ol</a>
        </p>
    </div>

    <!-- Portföy Paneli -->
    <div id="portfolio-section" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Portföyüm & Kâr/Zarar Durumu</h2>
            <button onclick="logout()" style="width: auto; background: #475569;">Çıkış Yap</button>
        </div>

        <div class="summary-box">
            <div class="summary-item">
                <label>Toplam Maliyet</label>
                <span id="total-cost-val">0.00 ₺</span>
            </div>
            <div class="summary-item">
                <label>Güncel Portföy Değeri</label>
                <span id="total-value-val">0.00 ₺</span>
            </div>
            <div class="summary-item">
                <label>Toplam Kâr / Zarar</label>
                <span id="total-pl-val">0.00 ₺</span>
            </div>
        </div>

        <h3>Yeni Varlık Ekle</h3>
        <div class="form-group">
            <input type="text" id="symbol" placeholder="Sembol (Örn: THYAO.IS, USDTRY=X, AAPL)">
            <input type="number" id="amount" step="any" placeholder="Adet">
            <input type="number" id="buy-price" step="any" placeholder="Ort. Alış Fiyatı (₺)">
            <button onclick="addAsset()">Ekle</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Sembol</th>
                    <th>Adet</th>
                    <th>Ort. Alış</th>
                    <th>Anlık Fiyat</th>
                    <th>Güncel Değer</th>
                    <th>Kâr / Zarar</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="portfolio-list">
                <!-- Veriler JS ile doldurulacak -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let isLogin = true;
    let token = localStorage.getItem("access_token");

    if (token) {
        showPortfolio();
    }

    function toggleAuthMode() {
        isLogin = !isLogin;
        document.getElementById("form-title").innerText = isLogin ? "Giriş Yap" : "Kayıt Ol";
        document.getElementById("toggle-auth").innerText = isLogin ? "Hesabın yok mu? Kayıt Ol" : "Zaten hesabın var mı? Giriş Yap";
    }

    async function handleAuth() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const endpoint = isLogin ? "/login" : "/register";

        const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
            if (isLogin) {
                localStorage.setItem("access_token", data.access_token);
                token = data.access_token;
                showPortfolio();
            } else {
                alert("Kayıt başarılı! Şimdi giriş yapabilirsiniz.");
                toggleAuthMode();
            }
        } else {
            alert(data.detail || "Bir hata oluştu.");
        }
    }

    function logout() {
        localStorage.removeItem("access_token");
        token = null;
        document.getElementById("portfolio-section").classList.add("hidden");
        document.getElementById("auth-section").classList.remove("hidden");
    }

    function showPortfolio() {
        document.getElementById("auth-section").classList.add("hidden");
        document.getElementById("portfolio-section").classList.remove("hidden");
        loadPortfolio();
    }

    async function loadPortfolio() {
        const response = await fetch(`/portfolio?token=${token}`);
        if (!response.ok) {
            logout();
            return;
        }

        const data = await response.json();
        const list = document.getElementById("portfolio-list");
        list.innerHTML = "";

        let grandTotalCost = 0;
        let grandTotalValue = 0;

        data.forEach(item => {
            grandTotalCost += item.total_cost;
            grandTotalValue += item.current_value;

            const isProfitable = item.profit_loss >= 0;
            const plClass = isProfitable ? "profit" : "loss";
            const plSign = isProfitable ? "+" : "";

            list.innerHTML += `
                <tr>
                    <td><b>${item.symbol}</b></td>
                    <td>${item.amount}</td>
                    <td>${item.buy_price.toFixed(2)} ₺</td>
                    <td>${item.current_price.toFixed(2)} ₺</td>
                    <td>${item.current_value.toFixed(2)} ₺</td>
                    <td class="${plClass}">${plSign}${item.profit_loss.toFixed(2)} ₺ (%${item.profit_loss_percent})</td>
                    <td><button class="btn-delete" onclick="deleteAsset(${item.id})">Sil</button></td>
                </tr>
            `;
        });

        const totalPL = grandTotalValue - grandTotalCost;
        const totalPLClass = totalPL >= 0 ? "profit" : "loss";

        document.getElementById("total-cost-val").innerText = grandTotalCost.toFixed(2) + " ₺";
        document.getElementById("total-value-val").innerText = grandTotalValue.toFixed(2) + " ₺";
        
        const totalPLSpan = document.getElementById("total-pl-val");
        totalPLSpan.innerText = (totalPL >= 0 ? "+" : "") + totalPL.toFixed(2) + " ₺";
        totalPLSpan.className = totalPLClass;
    }

    async function addAsset() {
        const symbol = document.getElementById("symbol").value;
        const amount = parseFloat(document.getElementById("amount").value);
        const buy_price = parseFloat(document.getElementById("buy-price").value) || 0.0;

        if (!symbol || isNaN(amount)) {
            alert("Lütfen geçerli bir sembol ve adet girin.");
            return;
        }

        await fetch(`/portfolio/add?token=${token}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ symbol, amount, buy_price })
        });

        document.getElementById("symbol").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("buy-price").value = "";
        loadPortfolio();
    }

    async function deleteAsset(id) {
        await fetch(`/portfolio/delete/${id}?token=${token}`, { method: "DELETE" });
        loadPortfolio();
    }
</script>

</body>
</html>
