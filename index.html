<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finansım - Kişisel Finans & Portföy Asistanı</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            padding-bottom: 40px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            padding: 16px;
            display: none;
        }

        /* Kart Stilleri */
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 20px;
        }

        /* Başlıklar ve Butonlar */
        h2, h3, h4 {
            color: #111827;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover { background-color: #4338ca; }
        .btn-secondary { background-color: #10b981; }
        .btn-secondary:hover { background-color: #059669; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }

        /* Auth / Tab Stilleri */
        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
        }

        .tab-btn.active {
            color: #4f46e5;
            border-bottom: 3px solid #4f46e5;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        /* Dashboard Grid Stilleri */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 4px solid #4f46e5;
        }

        .summary-card.income { border-left-color: #10b981; }
        .summary-card.expense { border-left-color: #ef4444; }
        .summary-card.portfolio { border-left-color: #f59e0b; }

        .summary-card small {
            color: #6b7280;
            font-weight: 600;
            font-size: 12px;
        }

        .summary-card h3 {
            font-size: 20px;
            margin-top: 4px;
        }

        /* İşlem Listesi Tablosu */
        .transaction-list {
            list-style: none;
            margin-top: 10px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f3f4f6;
        }

        .transaction-item:last-child { border-bottom: none; }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-income { background: #d1fae5; color: #065f46; }
        .badge-expense { background: #fee2e2; color: #991b1b; }
        .badge-portfolio { background: #fef3c7; color: #92400e; }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
        }

        .badge-security {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>

    <!-- KULLANICI GİRİŞ & KAYIT EKRANI -->
    <div id="auth-section" class="container">
        <div class="card" style="text-align: center;">
            <h2>Finansım</h2>
            <p style="color: #6b7280; font-size: 14px; margin-bottom: 16px;">Kişisel Portföy & Bütçe Yönetimi</p>

            <div style="margin-bottom: 20px;">
                <a href="/download-apk" style="text-decoration: none;">
                    <button class="btn btn-secondary">📲 APK Uygulamasını İndir</button>
                </a>
            </div>

            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('login')">Giriş Yap</button>
                <button class="tab-btn" onclick="switchTab('register')">Kayıt Ol</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="login-username" placeholder="Kullanıcı adınız" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="login-password" placeholder="Şifreniz" required>
                </div>
                <button type="submit" class="btn">Giriş Yap</button>
            </form>

            <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="reg-username" placeholder="Kullanıcı adı belirleyin" required>
                </div>
                <div class="form-group">
                    <label>E-posta Adresi</label>
                    <input type="email" id="reg-email" placeholder="ornek@email.com" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="reg-password" placeholder="Şifre belirleyin" required>
                </div>
                <button type="submit" class="btn">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <!-- ANA PORTFÖY & FİNANS PANELİ -->
    <div id="app-section" class="app-container">
        
        <div class="header-bar">
            <div>
                <h3 style="color: #4f46e5;">Finansım</h3>
                <small id="user-display-name" style="color: #6b7280;"></small>
            </div>
            <button class="btn btn-danger" style="width: auto; padding: 8px 16px;" onclick="manualLogout()">Çıkış Yap</button>
        </div>

        <div style="text-align: center;">
            <span class="badge-security">🛡️ 45 Saniye Otomatik Güvenlik Aktif</span>
        </div>

        <!-- ÖZET KARTLARI -->
        <div class="summary-grid">
            <div class="summary-card">
                <small>TOPLAM BAKİYE</small>
                <h3 id="total-balance">₺0.00</h3>
            </div>
            <div class="summary-card income">
                <small>TOPLAM GELİR</small>
                <h3 id="total-income" style="color: #10b981;">₺0.00</h3>
            </div>
            <div class="summary-card expense">
                <small>TOPLAM GİDER</small>
                <h3 id="total-expense" style="color: #ef4444;">₺0.00</h3>
            </div>
            <div class="summary-card portfolio">
                <small>YATIRIM PORTFÖYÜ</small>
                <h3 id="total-portfolio" style="color: #d97706;">₺0.00</h3>
            </div>
        </div>

        <!-- İŞLEM / PORTFÖY EKLEME FORMU -->
        <div class="card">
            <h4>+ Yeni İşlem / Varlık Ekle</h4>
            <form id="transaction-form" onsubmit="addTransaction(event)" style="margin-top: 14px;">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px;">
                    <div class="form-group">
                        <label>İşlem Türü</label>
                        <select id="tx-type">
                            <option value="income">Gelir (+)</option>
                            <option value="expense">Gider (-)</option>
                            <option value="portfolio">Yatırım / Varlık (Portföy)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Başlık / Açıklama</label>
                        <input type="text" id="tx-title" placeholder="Maaş, Borsa, Altın vb." required>
                    </div>
                    <div class="form-group">
                        <label>Tutar (₺)</label>
                        <input type="number" id="tx-amount" step="0.01" placeholder="0.00" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-secondary" style="margin-top: 6px;">Kaydet ve Ekle</button>
            </form>
        </div>

        <!-- GEÇMİŞ İŞLEMLER VE PORTFÖY LİSTESİ -->
        <div class="card">
            <h4>Portföy ve Hareket Geçmişi</h4>
            <ul id="transaction-list" class="transaction-list">
                <!-- Dinamik İşlemler Buraya Gelecek -->
            </ul>
        </div>

    </div>

    <script>
        // Service Worker Kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log(err));
            });
        }

        // Tab Değişimi
        function switchTab(tab) {
            document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
            const btns = document.querySelectorAll('.tab-btn');
            btns[0].classList.toggle('active', tab === 'login');
            btns[1].classList.toggle('active', tab === 'register');
        }

        // Kullanıcı Verileri
        let currentUser = null;
        let userTransactions = [];

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            currentUser = username;
            sessionStorage.setItem("loggedInUser", username);

            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('user-display-name').innerText = "Kullanıcı: " + username;

            loadUserData();
            startInactivityMonitoring();
        }

        function handleRegister(e) {
            e.preventDefault();
            alert("Kayıt başarılı! Lütfen giriş yapın.");
            switchTab('login');
        }

        function manualLogout() {
            stopInactivityMonitoring();
            sessionStorage.removeItem("loggedInUser");
            document.getElementById('app-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
        }

        // Portföy Verilerini Yükle
        function loadUserData() {
            const savedData = localStorage.getItem("finansim_data_" + currentUser);
            userTransactions = savedData ? JSON.parse(savedData) : [];
            updateUI();
        }

        function saveUserData() {
            localStorage.setItem("finansim_data_" + currentUser, JSON.stringify(userTransactions));
            updateUI();
        }

        // İşlem / Yatırım Ekleme
        function addTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('tx-type').value;
            const title = document.getElementById('tx-title').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);

            const newTx = {
                id: Date.now(),
                type: type,
                title: title,
                amount: amount,
                date: new Date().toLocaleDateString('tr-TR')
            };

            userTransactions.unshift(newTx);
            saveUserData();

            document.getElementById('transaction-form').reset();
        }

        function deleteTransaction(id) {
            userTransactions = userTransactions.filter(tx => tx.id !== id);
            saveUserData();
        }

        // UI Arayüz Güncelleme & Hesaplamalar
        function updateUI() {
            let totalIncome = 0;
            let totalExpense = 0;
            let totalPortfolio = 0;

            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            if (userTransactions.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#9ca3af; padding:15px;">Henüz hiç veri veya yatırım eklenmedi.</p>';
            }

            userTransactions.forEach(tx => {
                if (tx.type === 'income') totalIncome += tx.amount;
                if (tx.type === 'expense') totalExpense += tx.amount;
                if (tx.type === 'portfolio') totalPortfolio += tx.amount;

                const li = document.createElement('li');
                li.className = 'transaction-item';

                let badgeClass = 'badge-income';
                let badgeText = 'Gelir';
                let sign = '+';

                if (tx.type === 'expense') {
                    badgeClass = 'badge-expense';
                    badgeText = 'Gider';
                    sign = '-';
                } else if (tx.type === 'portfolio') {
                    badgeClass = 'badge-portfolio';
                    badgeText = 'Yatırım';
                    sign = '📈';
                }

                li.innerHTML = `
                    <div>
                        <strong>${tx.title}</strong> 
                        <span class="badge ${badgeClass}">${badgeText}</span>
                        <div style="font-size:12px; color:#6b7280;">${tx.date}</div>
                    </div>
                    <div>
                        <strong style="font-size:15px;">${sign}₺${tx.amount.toLocaleString('tr-TR', {minimumFractionDigits: 2})}</strong>
                        <button class="delete-btn" onclick="deleteTransaction(${tx.id})">🗑️</button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            const netBalance = (totalIncome - totalExpense) + totalPortfolio;

            document.getElementById('total-balance').innerText = '₺' + netBalance.toLocaleString('tr-TR', {minimumFractionDigits: 2});
            document.getElementById('total-income').innerText = '₺' + totalIncome.toLocaleString('tr-TR', {minimumFractionDigits: 2});
            document.getElementById('total-expense').innerText = '₺' + totalExpense.toLocaleString('tr-TR', {minimumFractionDigits: 2});
            document.getElementById('total-portfolio').innerText = '₺' + totalPortfolio.toLocaleString('tr-TR', {minimumFractionDigits: 2});
        }

        // 45 SANİYE GÜVENLİK ZAMANLAYICISI
        let inactivityTimer;
        const TIMEOUT_DURATION = 45000;
        const activityEvents = ['mousemove', 'keydown', 'click', 'touchstart', 'scroll'];

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            if (sessionStorage.getItem("loggedInUser")) {
                inactivityTimer = setTimeout(autoLogout, TIMEOUT_DURATION);
            }
        }

        function autoLogout() {
            stopInactivityMonitoring();
            sessionStorage.removeItem("loggedInUser");
            document.getElementById('app-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
            alert("Güvenliğiniz için 45 saniye işlem yapılmadığından oturumunuz kapatılmıştır.");
        }

        function startInactivityMonitoring() {
            activityEvents.forEach(evt => window.addEventListener(evt, resetInactivityTimer, true));
            resetInactivityTimer();
        }

        function stopInactivityMonitoring() {
            activityEvents.forEach(evt => window.removeEventListener(evt, resetInactivityTimer, true));
            clearTimeout(inactivityTimer);
        }
    </script>
</body>
</html>
