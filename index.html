<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet'in Finans Asistanı</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Menü */
        header {
            background-color: #1e293b;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            color: #38bdf8;
        }

        .btn {
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-download {
            background: linear-gradient(135deg, #0284c7, #2563eb);
        }

        .btn-update {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Ana İçerik */
        main {
            flex: 1;
            padding: 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .card h2 {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .card .amount {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
        }

        .status-banner {
            background-color: rgba(56, 189, 248, 0.1);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span>📊</span> Mehmet'in Finans Asistanı
        </div>
        
        <!-- Dinamik Buton Alanı (JS Tarafından Yönetilir) -->
        <div id="actionButtonContainer"></div>
    </header>

    <main>
        <div id="statusNotice" class="status-banner">
            İçerik yükleniyor...
        </div>

        <div class="card">
            <h2>Toplam Varlık</h2>
            <div class="amount">₺0,00</div>
        </div>

        <div class="card">
            <h2>Aylık Gelir / Gider Özeti</h2>
            <p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Finansal verileriniz senkronize ediliyor...</p>
        </div>
    </main>

    <script>
        // Kullanıcının Web'den mi yoksa Yüklü Uygulamadan mı girdiğini tespit et
        const isAppMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || navigator.userAgent.includes('FinansApp');

        const buttonContainer = document.getElementById('actionButtonContainer');
        const statusNotice = document.getElementById('statusNotice');

        if (isAppMode) {
            // UYGULAMA İÇİNDEN GİRİLDİYSE: Güncelle Butonu Göster
            statusNotice.innerHTML = "📱 **Uygulama Modundasınız.** Tüm güncellemeler anlık olarak senkronize edilir.";
            
            buttonContainer.innerHTML = `
                <button class="btn btn-update" onclick="forceAppUpdate()">
                    🔄 Güncellemeyi Denetle
                </button>
            `;
        } else {
            // TARAYICIDAN GİRİLDİYSE: Doğrudan APK İndir / Yükle Butonu Göster
            statusNotice.innerHTML = "🌐 **Web Sürümündesiniz.** Dilerseniz uygulamayı telefonunuza APK olarak indirebilirsiniz.";
            
            // Timestamp ekleyerek tarayıcı indirme engelini aşıyoruz
            const downloadUrl = "/download-apk?t=" + new Date().getTime();
            
            buttonContainer.innerHTML = `
                <a href="${downloadUrl}" class="btn btn-download">
                    📲 APK Uygulamasını İndir
                </a>
            `;
        }

        // Uygulama içi güncelleme kontrolü
        function forceAppUpdate() {
            // Sayfayı sunucudan en güncel haliyle yeniden yükler
            window.location.reload(true);
            alert("Uygulama en güncel sürüme yenilendi!");
        }
    </script>
</body>
</html>
